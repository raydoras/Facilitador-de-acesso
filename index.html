<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <title>Título do projeto</title>
    <meta name="description" content="Portal de acesso ao projeto---. Insira seu código para acessar os formulários das atividades.">
    
    <style>
        body { 
            background-image: url('assets/images/cidade.jpg'); 
            background-size: cover;           
            background-position: center;      
            background-repeat: no-repeat;     
            background-attachment: fixed;     
            min-height: 100vh;
            background-color: #8585c3; 
        }

        .text-custom-purple { color: #d736bc; }
        .bg-custom-purple { background-color: #d736bc; color: rgb(255, 255, 255); }
        .bg-custom-purple:hover { background-color: #c02ea5; color: #e4afe1; }
        input:focus { border-color: #e59a30 !important; box-shadow: 0 0 0 0.25rem rgba(229, 154, 48, 0.25) !important; }

        .card-referencia {
            position: relative;
        }

        .img-lateral {
            position: absolute;
            width: 60px;       
            height: auto;      
            transition: all 0.3s ease; 
        }

        .img-topo {
            top: -80px;                    
            left: 50%;
            transform: translateX(-50%);   
        }

        .img-esquerda {
            left: -80px;                   
            top: 50%;
            transform: translateY(-50%);   
        }

        .img-direita {
            right: -80px;                  
            top: 50%;
            transform: translateY(-50%);   
        }

        .img-base {
            bottom: -80px;                 
            left: 50%;
            transform: translateX(-50%);   
        }

        @media (max-width: 510px) {

            .img-topo {
                top: -70px;
                left: 30%;
                transform: translateX(-50%);
            }
            .img-esquerda {
                top: -70px;
                left: 70%;
                transform: translateX(-50%);
            }

            .img-direita {
                bottom: -70px;
                top: auto; 
                right: auto;
                left: 30%;
                transform: translateX(-50%);
            }
            .img-base {
                bottom: -70px;
                left: 70%;
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center">

    <div class="card p-4 shadow-sm text-center border-0 card-referencia" style="width: 350px; border-radius: 12px;">
        <img src="assets/images/1.png" class="img-lateral img-topo" alt="Imagem do Topo">
        <img src="assets/images/2.png" class="img-lateral img-esquerda" alt="Imagem da Esquerda">
        <img src="assets/images/3.png" class="img-lateral img-direita" alt="Imagem da Direita">
        <img src="assets/images/4.png" class="img-lateral img-base" alt="Imagem da Base">
        
     
        <div class="card-body">
            <h1 class="h3 fw-bold mb-2 text-dark">Seja bem-vindo!</h1>
            <p class="text-secondary small mb-4">Introduza o código para continuar</p>
            
            <input type="text" id="inputCodigo" class="form-control form-control-lg rounded-pill text-center mb-3" placeholder="Digite o código aqui">
            
            <button onclick="acessar()" class="btn bg-custom-purple btn-lg rounded-pill w-100 fw-medium">Acessar</button>
            
            <div id="mensagemErro" class="text-danger small mt-3" style="display: none;">Código não encontrado. Tente novamente.</div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function acessar() {
            const campo = document.getElementById('inputCodigo');
            const erro = document.getElementById('mensagemErro');
            const codigo = campo.value.trim().toUpperCase();

            const baseDeDados = {
                "C1": "https://docs.google.com/forms/LINK1",
                "C2": "https://docs.google.com/forms/LINK2",
                "C3": "https://docs.google.com/forms/LINK3",
                "C4": "https://docs.google.com/forms/LINK4",
                "C5": "https://docs.google.com/forms/LINK5",
                "C6": "https://docs.google.com/forms/LINK6"
            };

            if (baseDeDados[codigo]) {
                erro.style.display = 'none';
                window.location.href = baseDeDados[codigo];
            } else {
                erro.style.display = 'block';
            }
        }
    </script>
</body>
</html>
